name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: kiki-layout-optimizer
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pytest -q
      - run: for f in tests/*.cjs; do node "$f" || exit 1; done
        shell: bash
